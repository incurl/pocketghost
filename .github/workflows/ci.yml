name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Format
        run: |
          out=$(gofmt -l ./cmd ./internal)
          if [ -n "$out" ]; then echo "unformatted: $out"; exit 1; fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -count=1 -race ./...

      - name: Build (static, CGO disabled)
        run: make build static-check

      - name: No container dependencies
        run: make docker-free

      - name: Smoke test
        run: make smoke
